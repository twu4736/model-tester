<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型输入输出测试工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f0f2f5; color: #24292f; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: #57606a; }
  label { display: block; font-size: 13px; color: #57606a; margin: 8px 0 4px; }
  textarea, input[type=text], input[type=password], input[type=number] {
    width: 100%; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px 10px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  textarea { resize: vertical; min-height: 90px; }
  textarea:focus, input:focus { border-color: #0969da; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    background: #0969da; color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #0757ba; }
  button:disabled { background: #8c959f; cursor: not-allowed; }
  button.secondary { background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; }
  button.secondary:hover { background: #eaeef2; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    border: 1px solid #d0d7de; border-radius: 16px; padding: 4px 12px;
    font-size: 13px; cursor: pointer; user-select: none; background: #f6f8fa;
  }
  .chip.selected { background: #0969da; color: #fff; border-color: #0969da; }
  .chip.copied { outline: 2px solid #1a7f37; }
  .hint { font-size: 12px; color: #8c959f; margin-top: 4px; }
  .params { display: flex; gap: 12px; }
  .params > div { flex: 1; }
  .run-bar { display: flex; align-items: center; gap: 12px; }
  .status { font-size: 13px; color: #57606a; }
  .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .result-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eaeef2; padding-bottom: 8px; }
  .result-model { font-weight: bold; font-size: 14px; word-break: break-all; }
  .meta { font-size: 12px; color: #8c959f; white-space: nowrap; }
  .content { font-size: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.7; max-height: 480px; overflow-y: auto; }
  .error-box { color: #cf222e; background: #fff1f0; border: 1px solid #ffc1bd; border-radius: 6px; padding: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .reasoning { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #d0d7de; font-size: 13px; color: #57606a; white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
  .copy-btn { font-size: 12px; padding: 3px 10px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #d0d7de; border-top-color: #0969da; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dropzone { border: 2px dashed #d0d7de; border-radius: 6px; padding: 14px; text-align: center; font-size: 13px; color: #8c959f; cursor: pointer; margin-top: 10px; }
  .dropzone.dragover { border-color: #0969da; background: #f0f7ff; color: #0969da; }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .att { border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; background: #f6f8fa; max-width: 220px; }
  .att img { max-height: 40px; max-width: 60px; border-radius: 3px; }
  .att .att-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .rm { color: #cf222e; cursor: pointer; font-weight: bold; padding: 0 4px; }
  .att .rm:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>🧪 模型输入输出测试工具</h1>

  <div class="card">
    <h2>接口配置</h2>
    <div class="row">
      <div>
        <label>Base URL（OpenAI 兼容地址）</label>
        <input type="text" id="baseUrl" placeholder="例如 https://api.openai.com 或 https://open.bigmodel.cn/api/paas/v4">
      </div>
      <div>
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
      </div>
    </div>
    <div style="margin-top:10px">
      <button class="secondary" id="btnFetchModels" onclick="fetchModels()">获取模型列表</button>
      <button class="secondary" onclick="copyAllModels()">复制全部模型名</button>
      <span class="hint">自动在地址末尾补全 /v1（已带 /v1、/v4 等版本号的地址不会重复追加）· 单击模型卡片选中，双击复制模型名</span>
    </div>
    <label>选择要测试的模型（可多选对比）</label>
    <div class="chips" id="modelChips"><span class="hint">请先点击"获取模型列表"，或在下方手动输入模型名</span></div>
    <div class="row" style="margin-top:10px">
      <div>
        <label>手动添加模型名</label>
        <input type="text" id="manualModel" placeholder="输入模型名后回车，例如 glm-4.6">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>提示词</h2>
    <label>系统提示词（System Prompt，可留空）</label>
    <textarea id="systemPrompt" placeholder="例如：你是一个专业的翻译助手，只输出译文。"></textarea>
    <label>用户输入提示词（User Prompt）</label>
    <textarea id="userPrompt" placeholder="输入要发送给模型的内容"></textarea>
    <div class="dropzone" id="dropZone" onclick="fileInput.click()">
      📎 附件（图片 / 音频 / PDF / Word）：点击选择文件，或直接拖拽文件到这里
    </div>
    <div class="hint" style="margin-top:4px">Word 文档会自动调用本机 Word 转成 PDF 原样发送（模型可见完整排版）；转换失败时自动改用文本提取</div>
    <input type="file" id="fileInput" multiple hidden>
    <div class="attachments" id="attachments"></div>
    <div class="params" style="margin-top:10px">
      <div><label>temperature：<span id="tempVal">0.7</span></label><input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" oninput="tempVal.textContent=this.value"></div>
      <div><label>max_tokens</label><input type="number" id="maxTokens" value="1024" min="1"></div>
      <div><label>top_p（留空使用默认）</label><input type="text" id="topP" placeholder="例如 0.9"></div>
    </div>
  </div>

  <div class="card">
    <div class="run-bar">
      <button id="btnRun" onclick="runTest()">▶ 运行测试</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div id="results" class="results"></div>
</div>

<script>
const LS_KEY = 'model-tester-config';
const $ = id => document.getElementById(id);

// ---- 配置持久化 ----
function saveConfig() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    baseUrl: $('baseUrl').value, apiKey: $('apiKey').value,
    systemPrompt: $('systemPrompt').value, userPrompt: $('userPrompt').value,
    temperature: $('temperature').value, maxTokens: $('maxTokens').value, topP: $('topP').value,
    selected: [...document.querySelectorAll('.chip.selected')].map(c => c.dataset.model)
  }));
}
function loadConfig() {
  try {
    const c = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (c.baseUrl) $('baseUrl').value = c.baseUrl;
    if (c.apiKey) $('apiKey').value = c.apiKey;
    if (c.systemPrompt) $('systemPrompt').value = c.systemPrompt;
    if (c.userPrompt) $('userPrompt').value = c.userPrompt;
    if (c.temperature) { $('temperature').value = c.temperature; $('tempVal').textContent = c.temperature; }
    if (c.maxTokens) $('maxTokens').value = c.maxTokens;
    if (c.topP) $('topP').value = c.topP;
    if (c.selected && c.selected.length) {
      renderChips(c.selected);
      c.selected.forEach(m => selectChipByName(m));
    }
  } catch (e) {}
}
document.querySelectorAll('textarea, input').forEach(el => el.addEventListener('change', saveConfig));

// ---- 模型选择 ----
let modelList = [];
function renderChips(models) {
  modelList = models;
  $('modelChips').innerHTML = models.map(m =>
    `<span class="chip" data-model="${m}" onclick="toggleChip(this)" ondblclick="copyChip(this)" title="单击选中/取消 · 双击复制模型名">${m}</span>`).join('');
}
function selectChipByName(name) {
  const chip = document.querySelector(`.chip[data-model="${CSS.escape(name)}"]`);
  if (chip) chip.classList.add('selected');
}
function toggleChip(el) {
  el.classList.toggle('selected');
  saveConfig();
}
function getSelectedModels() {
  return [...document.querySelectorAll('.chip.selected')].map(c => c.dataset.model);
}

function copyChip(el) {
  navigator.clipboard.writeText(el.dataset.model).then(() => {
    el.classList.add('copied');
    $('status').textContent = `✓ 已复制模型名：${el.dataset.model}`;
    setTimeout(() => el.classList.remove('copied'), 800);
  });
}
function copyAllModels() {
  if (!modelList.length) { $('status').textContent = '⚠ 请先获取模型列表'; return; }
  navigator.clipboard.writeText(modelList.join('\n')).then(() => {
    $('status').textContent = `✓ 已复制全部 ${modelList.length} 个模型名`;
  });
}

async function fetchModels() {
  $('btnFetchModels').disabled = true;
  $('status').innerHTML = '<span class="spinner"></span>正在获取模型列表...';
  try {
    const resp = await fetch('/api/models', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ base_url: $('baseUrl').value, api_key: $('apiKey').value })
    });
    const data = await resp.json();
    if (data.ok) {
      if (data.models.length === 0) { $('status').textContent = '⚠ 接口返回了空模型列表'; }
      else {
        renderChips(data.models);
        $('status').textContent = `✓ 获取到 ${data.models.length} 个模型，点击卡片选择`;
      }
    } else {
      $('status').textContent = '✗ 获取失败：' + data.error;
    }
  } catch (e) { $('status').textContent = '✗ 请求失败：' + e.message; }
  $('btnFetchModels').disabled = false;
}

$('manualModel').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    const name = e.target.value.trim();
    if (!modelList.includes(name)) {
      renderChips([...modelList, name]);
      selectChipByName(name);
    } else selectChipByName(name);
    e.target.value = '';
    saveConfig();
  }
});

// ---- 附件（多模态） ----
let attachments = []; // {name, mime, size, data(base64)}

const fileInput = $('fileInput');
fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

const dropZone = $('dropZone');
['dragover', 'dragenter'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
dropZone.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function addFiles(files) {
  files.forEach(f => {
    const reader = new FileReader();
    reader.onload = () => {
      // reader.result 形如 "data:mime;base64,xxxx"，只保留 base64 部分
      attachments.push({ name: f.name, mime: f.type || 'application/octet-stream', size: f.size, data: reader.result.split(',')[1] });
      renderAttachments();
    };
    reader.readAsDataURL(f);
  });
}

function renderAttachments() {
  $('attachments').innerHTML = attachments.map((a, i) => {
    const isImg = a.mime.startsWith('image/');
    const thumb = isImg ? `<img src="data:${a.mime};base64,${a.data}" alt="">` : '<span style="font-size:20px">📄</span>';
    return `<span class="att">${thumb}<span class="att-name" title="${esc(a.name)}">${esc(a.name)}</span><span style="color:#8c959f">${fmtSize(a.size)}</span><span class="rm" onclick="removeAttachment(${i})">✕</span></span>`;
  }).join('');
}

function removeAttachment(i) { attachments.splice(i, 1); renderAttachments(); }

// ---- 运行测试 ----
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function runTest() {
  const models = getSelectedModels();
  const body = {
    base_url: $('baseUrl').value,
    api_key: $('apiKey').value,
    models,
    system_prompt: $('systemPrompt').value,
    user_prompt: $('userPrompt').value,
    temperature: parseFloat($('temperature').value),
    max_tokens: parseInt($('maxTokens').value) || 1024,
    top_p: $('topP').value ? parseFloat($('topP').value) : null,
    attachments
  };
  if (!models.length) { $('status').textContent = '✗ 请先选择至少一个模型'; return; }
  if (!body.user_prompt.trim() && !attachments.length) { $('status').textContent = '✗ 请填写用户输入提示词，或添加附件'; return; }
  const totalSize = attachments.reduce((s, a) => s + a.size, 0);
  if (totalSize > 100 * 1024 * 1024) { $('status').textContent = '✗ 附件总大小超过 100MB，请减少附件'; return; }

  $('btnRun').disabled = true;
  $('status').innerHTML = '<span class="spinner"></span>正在调用模型，请稍候...';
  $('results').innerHTML = models.map(m => `
    <div class="result-card">
      <div class="result-head"><span class="result-model">${esc(m)}</span><span class="meta">请求中...</span></div>
      <div class="content"><span class="spinner"></span></div>
    </div>`).join('');

  try {
    const resp = await fetch('/api/test', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!data.ok) { $('status').textContent = '✗ ' + data.error; $('results').innerHTML = ''; return; }
    renderResults(data.results);
    $('status').textContent = `✓ 完成，共 ${data.results.length} 个模型`;
  } catch (e) {
    $('status').textContent = '✗ 请求失败：' + e.message;
    $('results').innerHTML = '';
  }
  $('btnRun').disabled = false;
}

function renderResults(results) {
  $('results').innerHTML = results.map(r => {
    if (!r.ok) {
      return `<div class="result-card">
        <div class="result-head"><span class="result-model">${esc(r.model)}</span><span class="meta">${r.elapsed}s</span></div>
        <div class="error-box">${esc(r.error)}</div>
      </div>`;
    }
    const usage = r.usage || {};
    const usageText = [usage.prompt_tokens != null ? `输入 ${usage.prompt_tokens}` : '',
                       usage.completion_tokens != null ? `输出 ${usage.completion_tokens}` : '',
                       usage.total_tokens != null ? `共 ${usage.total_tokens} tokens` : ''].filter(Boolean).join(' · ');
    return `<div class="result-card">
      <div class="result-head">
        <span class="result-model">${esc(r.model)}</span>
        <span class="meta">${r.elapsed}s${usageText ? ' · ' + usageText : ''} <button class="copy-btn secondary" onclick="copyText(this)">复制</button></span>
      </div>
      <div class="content">${esc(r.content)}</div>
      ${r.reasoning ? `<div class="reasoning"><b>思考过程：</b>${esc(r.reasoning)}</div>` : ''}
    </div>`;
  }).join('');
}

function copyText(btn) {
  const content = btn.closest('.result-card').querySelector('.content').textContent;
  navigator.clipboard.writeText(content).then(() => {
    const old = btn.textContent; btn.textContent = '✓ 已复制';
    setTimeout(() => btn.textContent = old, 1200);
  });
}

loadConfig();
</script>
</body>
</html>
